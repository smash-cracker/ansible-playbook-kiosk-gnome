---
- name: Deploy Just Perfection GNOME extension
  hosts: install_targets
  become: true
  tasks:
    - name: Install required packages
      apt:
        name:
          - gettext
          - gnome-shell-extension-manager
        state: present
        update_cache: yes

    - name: Copy just perfection to remote host
      copy:
        src: ./just-perfection-26.0.zip
        dest: /home/cezen/Documents/just-perfection-26.0.zip
        owner: cezen
        group: cezen
        mode: '0664'

    - name: Extract just-perfection-26.0.zip
      unarchive:
        src: /home/cezen/Documents/just-perfection-26.0.zip
        dest: /home/cezen/Documents/
        owner: cezen
        group: cezen
        mode: '0775'
        remote_src: yes

    - name: Make build script executable
      file:
        path: /home/cezen/Documents/just-perfection-26.0/scripts/build.sh
        mode: '0755'
        owner: cezen
        group: cezen

    - name: Run just-perfection build script
      shell: ./scripts/build.sh -i
      args:
        chdir: /home/cezen/Documents/just-perfection-26.0
      become_user: cezen
      become: true

    - name: Move GNOME extension to system-wide directory
      shell: |
        mv /home/cezen/.local/share/gnome-shell/extensions/just-perfection-desktop@just-perfection /usr/share/gnome-shell/extensions/
      become: true

    - name: Restart GNOME Shell session
      command: gnome-session-quit --logout --no-prompt
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: cezen
      become: true
      ignore_errors: yes

    - name: Wait for system to be ready after logout
      wait_for_connection:
        timeout: 300
        delay: 30

    - name: Enable Just Perfection GNOME extension
      command: gnome-extensions enable just-perfection-desktop@just-perfection
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: cezen
      become: true

    - name: Compile schemas in extension directory (first compilation)
      command: glib-compile-schemas /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection/schemas
      become: true

    - name: Copy gschema.xml files to global schemas directory
      shell: cp /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection/schemas/*.gschema.xml /usr/share/glib-2.0/schemas/
      become: true

    - name: Recompile global schemas (second compilation)
      command: glib-compile-schemas /usr/share/glib-2.0/schemas/
      become: true

    - name: Test - Disable top panel in Just Perfection
      command: gsettings set org.gnome.shell.extensions.just-perfection panel false
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: cezen
      become: true

    - name: Hide trash icon from Dash to Dock
      command: gsettings set org.gnome.shell.extensions.dash-to-dock show-trash false
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: cezen
      become: true

    - name: Hide mounts icon from Dash to Dock
      command: gsettings set org.gnome.shell.extensions.dash-to-dock show-mounts false
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: cezen
      become: true