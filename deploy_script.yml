---
- name: Deploy Just Perfection GNOME extension
  hosts: install_targets
  become: true

  vars:
    user_name: cezen

  tasks:
    - name: Install required packages
      apt:
        name:
          - gettext
          - gnome-shell-extension-manager
          - libglib2.0-dev-bin
          - libfuse2
          - dconf-editor
        state: present
        update_cache: yes

    - name: Copy just perfection to remote host
      copy:
        src: ./assets/just-perfection-26.0.zip
        dest: /home/{{ user_name }}/Documents/just-perfection-26.0.zip
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0664'

    - name: Extract just-perfection-26.0.zip
      unarchive:
        src: /home/{{ user_name }}/Documents/just-perfection-26.0.zip
        dest: /home/{{ user_name }}/Documents/
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0775'
        remote_src: yes

    - name: Make build script executable
      file:
        path: /home/{{ user_name }}/Documents/just-perfection-26.0/scripts/build.sh
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Run just-perfection build script
      shell: ./scripts/build.sh -i
      args:
        chdir: /home/{{ user_name }}/Documents/just-perfection-26.0
      become_user: "{{ user_name }}"
      become: true

    - name: Check if system-wide extension already exists
      stat:
        path: /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection
      register: extension_dir

    - name: Move GNOME extension to system-wide directory
      shell: |
        mv /home/{{ user_name }}/.local/share/gnome-shell/extensions/just-perfection-desktop@just-perfection /usr/share/gnome-shell/extensions/
      become: true
      when: not extension_dir.stat.exists
    
    - name: Enable automatic login in GDM
      blockinfile:
        path: /etc/gdm3/custom.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          [daemon]
          AutomaticLoginEnable = true
          AutomaticLogin = {{ user_name }}

    - name: Disable Ubuntu release upgrade GUI prompt
      lineinfile:
        path: /etc/update-manager/release-upgrades
        regexp: '^Prompt='
        line: 'Prompt=never'
        owner: root
        group: root
        mode: '0644'

    - name: Reboot the system
      reboot:
        msg: "Rebooting after GNOME extension installation"
        reboot_timeout: 300

    - name: Enable Just Perfection GNOME extension
      command: gnome-extensions enable just-perfection-desktop@just-perfection
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: "{{ user_name }}"
      become: true

    - name: Compile schemas in extension directory (first compilation)
      command: glib-compile-schemas /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection/schemas
      become: true

    - name: Copy gschema.xml files to global schemas directory
      shell: cp /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection/schemas/*.gschema.xml /usr/share/glib-2.0/schemas/
      become: true

    - name: Recompile global schemas (second compilation)
      command: glib-compile-schemas /usr/share/glib-2.0/schemas/
      become: true

    # - name: Apply GNOME settings from external file
    #   shell: "{{ item }}"
    #   args:
    #     executable: /bin/bash
    #   become_user: "{{ user_name }}"
    #   become: true
