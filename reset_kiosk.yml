---
- name: Deploy VoIP AppImage application
  hosts: install_targets
  become: true
  gather_facts: true

  tasks:
    - name: Get current remote user
      set_fact:
        user_name: "{{ ansible_user_id }}" 

    - name: Get user information using getent
      getent:
        database: passwd
        key: "{{ user_name }}"
      register: getent_output

    - name: Remove dconf locks file to unlock GNOME settings
      file:
        path: /etc/dconf/db/local.d/locks/00-extension-settings
        state: absent
      become: true

    - name: Remove dconf user profile
      file:
        path: /etc/dconf/profile/user
        state: absent
      become: true

    - name: Update dconf system database after unlocking
      command: dconf update
      become: true

    - name: Reset user dconf settings to defaults
      command: dconf reset -f /
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_id }}/bus"
      become_user: "{{ user_name }}"
      become: true

    - name: Notify users to restart GNOME Shell session
      debug:
        msg: "GNOME settings have been unlocked and reset to defaults. Users should log out and back in or restart GNOME Shell (Alt+F2, type 'r', press Enter) for changes to take effect."