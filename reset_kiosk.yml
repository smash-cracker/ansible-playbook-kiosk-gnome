---
- name: Deploy VoIP AppImage application
  hosts: install_targets
  become: true
  gather_facts: true
  tasks:
    - name: Remove dconf locks file to unlock GNOME settings
      file:
        path: /etc/dconf/db/local.d/locks/00-extension-settings
        state: absent
      become: true

    - name: Remove dconf user profile
      file:
        path: /etc/dconf/profile/user
        state: absent
      become: true

    - name: Update dconf system database after unlocking
      command: dconf update
      become: true

    - name: Notify users to restart GNOME Shell session
      debug:
        msg: "GNOME settings have been unlocked. Users should log out and back in or restart GNOME Shell (Alt+F2, type 'r', press Enter) for changes to take effect."