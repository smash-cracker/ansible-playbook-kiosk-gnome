#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
#
# dkms install & make deb package (2018/11/22, Hardkernel Co.,Ltd)
#
#------------------------------------------------------------------------------
#
# need package : dkms, debhelper
# driver source location : /usr/src/..
#
# ** Module name cannot contain '_' **
#
#------------------------------------------------------------------------------
# * dkms add
# sudo dkms add -m <module name> -v <version>
# ex) sudo dkms add -m dwav-usb-mt -v 1.0.0
#
# * dkms build
# sudo dkms add -m <module name> -v <version>
#
# * dkms install
# sudo dkms add -m <module name> -v <version>
#
# * make dkms deb package
# sudo dkms mkdeb -m <module name> -v <version>
#
# * dkms uninstall
# sudo dkms remove -m <module name> -v <version> --all
#
#------------------------------------------------------------------------------
# * deb package install
# sudo dpkg -i <package name>
#
# * deb package uninstall
# sudo dpkg -r <package name>
#------------------------------------------------------------------------------
#------------------------------------------------------------------------------
PACKAGE_NAME=dwav-usb-mt
PACKAGE_VERSION=1.0.0
BUILT_MODULE_NAME=dwav-usb-mt
DEST_MODULE_LOCATION=/kernel/drivers/input/touchscreen

MAKE="'make' all KVER=${kernelver}"
CLEAN="'make' clean"

AUTOINSTALL="yes"
