---
- name: Deploy Just Perfection GNOME extension
  hosts: install_targets
  become: true

  vars:
    user_name: cezen

  tasks:
    - name: Copy AppImageLauncher deb package to remote
      copy:
        src: ./assets/appimagelauncher_2.2.0-travis995.0f91801.bionic_amd64.deb
        dest: /tmp/appimagelauncher_2.2.0-travis995.0f91801.bionic_amd64.deb
        mode: '0644'

    - name: Install AppImageLauncher from deb package
      apt:
        deb: /tmp/appimagelauncher_2.2.0-travis995.0f91801.bionic_amd64.deb
        state: present
      become: yes

    - name: Reboot the system
      reboot:
        msg: "Rebooting after GNOME extension installation"
        reboot_timeout: 300