---
- name: Deploy VoIP AppImage application
  hosts: install_targets
  become: true
  vars:
    user_name: cezen
    appimage_name: voip-x86_64_v1.0.1.AppImage
    appimage_path: /home/cezen/Applications/voip-x86_64_v1.0.1.AppImage
    desktop_file_path: /home/cezen/.config/autostart/voip.desktop

  tasks:
    - name: Create Applications directory for user
      file:
        path: /home/{{ user_name }}/Applications
        state: directory
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Copy VoIP AppImage to user Applications folder
      copy:
        src: ./assets/{{ appimage_name }}
        dest: "{{ appimage_path }}"
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Create autostart config directory
      file:
        path: /home/{{ user_name }}/.config/autostart
        state: directory
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Create .desktop file to run AppImage at startup
      copy:
        dest: "{{ desktop_file_path }}"
        content: |
          [Desktop Entry]
          Type=Application
          Exec={{ appimage_path }}
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          Name=CVoIP
          Comment=Start CVoIP App on login
        mode: '0644'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Reboot the system
      reboot:
        msg: "Rebooting after VoIP AppImage deployment"
        reboot_timeout: 300
