---
- name: Deploy VoIP AppImage application
  hosts: install_targets
  become: true
  vars:
    user_name: cezen
    appimage_name: voip-x86_64_v1.5.17.AppImage
    ini_name: voip.ini
    appimage_path: /home/{{ user_name }}/Applications/{{ appimage_name }}
    ini_path: /home/{{ user_name }}/.config/voip/{{ ini_name }}
    desktop_file_path: /home/{{ user_name }}/.config/autostart/voip.desktop
    systemd_user_dir: /home/{{ user_name }}/.config/systemd/user
    service_unit: voip.service

  tasks:
    - name: Create Applications directory for user
      file:
        path: /home/{{ user_name }}/Applications
        state: directory
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Copy VoIP AppImage to user Applications folder
      copy:
        src: ./assets/{{ appimage_name }}
        dest: "{{ appimage_path }}"
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Find older VoIP AppImages
      find:
        paths: /home/{{ user_name }}/Applications
        patterns: 'voip-*.AppImage'
        file_type: file
      register: installed_appimages

    - name: Remove older VoIP AppImages
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ installed_appimages.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: item.path != appimage_path

    - name: Create voip config directory
      file:
        path: "{{ ini_path | dirname }}"
        state: directory
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Copy VoIP .ini to user Applications folder
      copy:
        src: ./assets/{{ ini_name }}
        dest: "{{ ini_path }}"
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Create autostart config directory
      file:
        path: /home/{{ user_name }}/.config/autostart
        state: directory
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Create .desktop file to run AppImage at startup
      copy:
        dest: "{{ desktop_file_path }}"
        content: |
          [Desktop Entry]
          Type=Application
          Exec={{ appimage_path }}
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          Name=CVoIP
          Comment=Start CVoIP App on login
        mode: '0644'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
    
    # - name: Remove Firefox snap package
    #   command: sudo snap remove firefox
    #   become: true

    # - name: Install Firefox snap package
    #   command: sudo snap install firefox
    #   become: true

    - name: Reboot the system
      reboot:
        msg: "Rebooting after VoIP AppImage and systemd service deployment"
        reboot_timeout: 300
