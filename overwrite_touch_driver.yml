---
- name: Install Touch Driver
  hosts: install_targets
  become: true
  vars:
    user_name: cezen
    driver_source_folder: ./assets/touch-driver
    driver_dest_folder: /home/{{ user_name }}/touch-driver

  tasks:
    - name: Remove existing DKMS registrations (ignore if absent)
      shell: dkms remove -m dwav-usb-mt -v 1.0.0 --all || true
      changed_when: true

    - name: Delete old DKMS source tree
      file:
        path: /usr/src/dwav-usb-mt-1.0.0
        state: absent

    - name: Copy touch-driver folder to remote device
      copy:
        src: "{{ driver_source_folder }}/"
        dest: "{{ driver_dest_folder }}"
        mode: preserve
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Make install script executable
      file:
        path: "{{ driver_dest_folder }}/install-touch-driver.sh"
        mode: '0755'

    - name: Execute install-touch-driver.sh script
      shell: "{{ driver_dest_folder }}/install-touch-driver.sh"
      args:
        chdir: "{{ driver_dest_folder }}"
      register: install_result

    - name: Display installation output
      debug:
        var: install_result.stdout_lines

    - name: Display installation errors if any
      debug:
        var: install_result.stderr_lines
      when: install_result.stderr_lines is defined and install_result.stderr_lines | length > 0

    - name: Reboot the system
      reboot:
        msg: "Rebooting after VoIP AppImage and systemd service deployment"
        reboot_timeout: 300
