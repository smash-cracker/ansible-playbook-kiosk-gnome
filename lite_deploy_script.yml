    - name: Set up dconf profile to include system database
      copy:
        dest: /etc/dconf/profile/user
        content: |
          user-db:user
          system-db:local
    
    - name: Create dconf local.d directory
      file:
        path: /etc/dconf/db/local.d
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Add default GNOME settings to system database
      copy:
        dest: /etc/dconf/db/local.d/00-extension-settings
