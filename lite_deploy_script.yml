---
- name: Deploy Just Perfection GNOME extension
  hosts: install_targets
  become: true

  vars:
    user_name: cezen
    panels_to_disable:
    - gnome-camera-panel.desktop
    - gnome-color-panel.desktop
    - gnome-default-apps-panel.desktop
    - gnome-bluetooth-panel.desktop
    - gnome-background-panel.desktop
    - gnome-multitasking-panel.desktop
    - gnome-sharing-panel.desktop
    - gnome-applications-panel.desktop
    - gnome-notifications-panel.desktop
    - gnome-online-accounts-panel.desktop
    - gnome-printers-panel.desktop
    - gnome-region-panel.desktop
    - gnome-removable-media-panel.desktop
    - gnome-user-accounts-panel.desktop
    - gnome-ubuntu-panel.desktop
    - gnome-keyboard-panel.desktop
    - gnome-mouse-panel.desktop
# 
    - gnome-usage-panel.desktop
    - gnome-thunderbolt-panel.desktop
    - gnome-location-panel.desktop
    - gnome-diagnostics-panel.desktop
    - gnome-connectivity-panel.desktop
    - gnome-search-panel.desktop
    - gnome-display-panel.desktop

  tasks:
    - name: Install required packages
      apt:
        name:
          - gettext
          - gnome-shell-extension-manager
          - libglib2.0-dev-bin
          - libfuse2
          - dconf-editor
        state: present
        update_cache: no

    - name: Rename unwanted .desktop files
      command: >
        mv /usr/share/applications/{{ item }}
           /usr/share/applications/{{ item }}.disabled
      args:
        creates: "/usr/share/applications/{{ item }}.disabled"
      ignore_errors: true
      loop: "{{ panels_to_disable }}"
      register: rename_result

    - name: Copy just perfection to remote host
      copy:
        src: ./assets/just-perfection-26.0.zip
        dest: /home/{{ user_name }}/Documents/just-perfection-26.0.zip
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0664'

    - name: Configure inputrc to disable bell
      lineinfile:
        path: /home/{{ user_name }}/.inputrc
        line: 'set bell-style none'
        create: yes
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0644'
        
    - name: Set Update-Package-Lists to 0
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Update-Package-Lists'
        line: 'APT::Periodic::Update-Package-Lists "0";'
        create: yes

    - name: Set Unattended-Upgrade to 0
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Unattended-Upgrade'
        line: 'APT::Periodic::Unattended-Upgrade "0";'
        create: yes

    - name: Copy just perfection to remote host
      copy:
        src: ./assets/disable-finger-gestures.com.zip
        dest: /home/{{ user_name }}/Documents/disable-finger-gestures.com.zip
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0664'

    - name: Extract just-perfection-26.0.zip
      unarchive:
        src: /home/{{ user_name }}/Documents/just-perfection-26.0.zip
        dest: /home/{{ user_name }}/Documents/
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0775'
        remote_src: yes
    
    - name: Install disable-gestures GNOME extension
      command: gnome-extensions install --force /home/{{ user_name }}/Documents/disable-finger-gestures.com.zip
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: "{{ user_name }}"
      become: true

    - name: Make build script executable
      file:
        path: /home/{{ user_name }}/Documents/just-perfection-26.0/scripts/build.sh
        mode: '0755'
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Run just-perfection build script
      shell: ./scripts/build.sh -i
      args:
        chdir: /home/{{ user_name }}/Documents/just-perfection-26.0
      become_user: "{{ user_name }}"
      become: true

    - name: Check if system-wide extension already exists
      stat:
        path: /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection
      register: extension_dir

    - name: Move GNOME extension to system-wide directory
      shell: |
        mv /home/{{ user_name }}/.local/share/gnome-shell/extensions/just-perfection-desktop@just-perfection /usr/share/gnome-shell/extensions/
      become: true
      when: not extension_dir.stat.exists
    
    - name: Enable automatic login in GDM
      blockinfile:
        path: /etc/gdm3/custom.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          [daemon]
          AutomaticLoginEnable = true
          AutomaticLogin = {{ user_name }}

    - name: Disable Ubuntu release upgrade GUI prompt
      lineinfile:
        path: /etc/update-manager/release-upgrades
        regexp: '^Prompt='
        line: 'Prompt=never'
        owner: root
        group: root
        mode: '0644'

    - name: Disable Apport crash reporting (no more error popups)
      lineinfile:
        path: /etc/default/apport
        regexp: '^enabled='
        line: 'enabled=0'
        owner: root
        group: root
        mode: '0644'

    - name: Reboot the system
      reboot:
        msg: "Rebooting after GNOME extension installation"
        reboot_timeout: 300

    - name: Enable Just Perfection GNOME extension
      command: gnome-extensions enable just-perfection-desktop@just-perfection
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: "{{ user_name }}"
      become: true

    - name: Enable Disable Finger gestures GNOME extension
      command: gnome-extensions enable disable-finger-gestures.com
      environment:
        DISPLAY: ":0"
        XDG_CURRENT_DESKTOP: "GNOME"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"
      become_user: "{{ user_name }}"
      # become: true

    - name: Compile schemas in extension directory (first compilation)
      command: glib-compile-schemas /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection/schemas
      become: true

    - name: Copy gschema.xml files to global schemas directory
      shell: cp /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection/schemas/*.gschema.xml /usr/share/glib-2.0/schemas/
      become: true

    - name: Recompile global schemas (second compilation)
      command: glib-compile-schemas /usr/share/glib-2.0/schemas/
      become: true

    - name: Apply GNOME settings using gsettings
      command: "{{ item }}"
      loop:
        # Just perfection GNOME extension settings:
        - gsettings set org.gnome.shell.extensions.just-perfection panel false
        - gsettings set org.gnome.shell.extensions.just-perfection workspace-peek false
