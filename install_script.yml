- name: Deploy myscript and create systemd service
  hosts: install_targets
  become: true

  tasks:
    - name: Install required packages
      apt:
        name:
          - gettext
          - gnome-shell-extension-manager
        state: present
        update_cache: yes

    - name: Copy just perfection to remote host
      copy:
        src: ./just-perfection-26.0.zip
        dest: /home/cezen/Documents/just-perfection-26.0.zip
        owner: cezen
        group: cezen
        mode: '0664'

    - name: Extract just-perfection-26.0.zip
      unarchive:
        src: /home/cezen//Documents/just-perfection-26.0.zip
        dest: /home/cezen/Documents/
        owner: cezen
        group: cezen
        mode: '0775'
        remote_src: yes

    - name: Run just-perfection build script
      shell: ./scripts/build.sh -i
      args:
        chdir: /home/cezen/Documents/just-perfection-26.0
      become_user: cezen
      become: true

    - name: Move GNOME extension to system-wide directory
      shell: |
        cp -r /home/cezen/.local/share/gnome-shell/extensions/just-perfection-desktop@just-perfection /usr/share/gnome-shell/extensions/
      become: true

    - name: Set correct permissions for system extension
      file:
        path: /usr/share/gnome-shell/extensions/just-perfection-desktop@just-perfection
        owner: root
        group: root
        mode: '0755'
        recurse: yes
      become: true

    - name: Logout GNOME session to restart
      become_user: cezen
      become: true
      shell: |
        export DISPLAY=:0
        gnome-session-quit --logout --no-prompt
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Wait for session to restart
      pause:
        seconds: 20

    - name: Enable Just Perfection GNOME extension after restart
      become_user: cezen
      become: true
      shell: |
        export DISPLAY=:0
        gnome-extensions enable just-perfection-desktop@just-perfection
      args:
        executable: /bin/bash
      ignore_errors: yes